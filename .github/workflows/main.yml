
name: Build APK Flutter

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Upgrade Gradle Wrapper
        run: |
          sed -i 's/gradle-.*-all.zip/gradle-8.14.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Release
          path: build/app/outputs/flutter-apk/app-release.apk
